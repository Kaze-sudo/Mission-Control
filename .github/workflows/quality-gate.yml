name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        # Version comes from package.json#packageManager (pnpm@10.29.3) — the
        # single source of truth. action-setup@v4 errors if a `version:` is also
        # set here (ERR_PNPM_BAD_PM_VERSION), so do not re-specify it.
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Configure git identity
        run: |
          git config --global user.email "ci@mission-control.dev"
          git config --global user.name "CI"

      - name: Verify immutable workflow action pins
        run: python3 scripts/check-workflow-action-pins.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: API contract parity
        run: pnpm api:parity

      - name: Security audit command tests
        run: pnpm test:security-shell

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Prepare E2E environment
        run: cp .env.test .env

      - name: Build
        run: pnpm build

      - name: Verify standalone artifact boundaries
        run: pnpm artifact:check

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: E2E tests
        run: pnpm test:e2e

  agentos-live-e2e:
    # Optional live verification of the AgentOS operational layer (pause gate,
    # cancel, retry, execution approvals, SSE run events). Runs after the main
    # gate on every PR/push; never blocks it (continue-on-error).
    runs-on: ubuntu-latest
    needs: [quality-gate]
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        # Version comes from package.json#packageManager (pnpm@10.29.3) — the
        # single source of truth. action-setup@v4 errors if a `version:` is also
        # set here (ERR_PNPM_BAD_PM_VERSION), so do not re-specify it.
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Start server (standalone)
        run: |
          node .next/standalone/server.js &
          echo "PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/ || true)
            if [ "$code" != "000" ]; then echo "server up (HTTP $code)"; break; fi
            sleep 2
          done
        env:
          PORT: '3000'
          AUTH_USER: testadmin
          AUTH_PASS: testpass1234!
          AUTH_SECRET: test-legacy-secret
          MC_COOKIE_SECURE: ''
          MC_COOKIE_SAMESITE: lax

      - name: Run AgentOS live E2E
        run: node scripts/e2e-agentos-live.cjs --base http://127.0.0.1:3000
        env:
          AUTH_USER: testadmin
          AUTH_PASS: testpass1234!
          MC_URL: http://127.0.0.1:3000